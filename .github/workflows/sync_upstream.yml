name: 每日同步原作者源码

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 kalicyh 分支
        uses: actions/checkout@v7
        with:
          ref: kalicyh
          fetch-depth: 0

      - name: 配置Git用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并 upstream/dev 到 kalicyh
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="$(git rev-parse HEAD)"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Sesame-AG/Sesame-AG.git
          else
            git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git
          fi
          git fetch upstream dev:refs/remotes/upstream/dev

          set +e
          git merge upstream/dev --no-edit
          merge_status=$?
          set -e

          if [[ "${merge_status}" -ne 0 ]]; then
            git merge --abort || true
            sync_branch="sync-upstream-dev"
            git push --force origin refs/remotes/upstream/dev:refs/heads/${sync_branch}

            pr_number="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base "kalicyh" \
              --head "${sync_branch}" \
              --state open \
              --json number \
              --jq '.[0].number')"

            if [[ -z "${pr_number}" || "${pr_number}" == "null" ]]; then
              body_file="$(mktemp)"
              printf '%s\n\n%s\n' \
                "自动同步 upstream/dev 到 kalicyh 时合并失败，请在这个 PR 里手动处理。" \
                "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                > "${body_file}"
              pr_url="$(gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base "kalicyh" \
                --head "${sync_branch}" \
                --title "chore: sync upstream dev into kalicyh" \
                --body-file "${body_file}")"
              rm -f "${body_file}"
              pr_number="$(gh pr view "${pr_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq '.number')"
            fi

            echo "自动合并失败，已保留 PR #${pr_number} 供手动处理。" >&2
            exit 1
          fi

          after="$(git rev-parse HEAD)"
          if [[ "${before}" == "${after}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:kalicyh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Dev 打包发布
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_dev.yml --repo kalicyh/Sesame-AG --ref kalicyh
