name: 每日同步原作者源码

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 kalicyh 分支
        uses: actions/checkout@v7
        with:
          ref: kalicyh
          fetch-depth: 0

      - name: 配置Git用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并 upstream/dev 到 kalicyh
        id: sync
        run: |
          before="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git
          git fetch upstream dev:refs/remotes/upstream/dev
          git merge upstream/dev --no-edit
          after="$(git rev-parse HEAD)"
          if [[ "${before}" == "${after}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:kalicyh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Dev 打包发布
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_dev.yml --repo kalicyh/Sesame-AG --ref kalicyh
