name: 每日同步原作者源码

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 kalicyh 分支
        uses: actions/checkout@v7
        with:
          ref: kalicyh
          fetch-depth: 0

      - name: 配置Git用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 创建同步 PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sync_branch="sync-upstream-dev"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Sesame-AG/Sesame-AG.git
          else
            git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git
          fi
          git fetch upstream dev:refs/remotes/upstream/dev
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --force origin refs/remotes/upstream/dev:refs/heads/${sync_branch}

          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "kalicyh" \
            --head "${sync_branch}" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "${pr_number}" && "${pr_number}" != "null" ]]; then
            :
          else
            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "kalicyh" \
              --head "${sync_branch}" \
              --title "chore: sync upstream dev into kalicyh" \
              --body "自动同步 upstream/dev 到 kalicyh。若自动合并失败，请直接查看此 PR 处理。")"
            pr_number="$(gh pr view "${pr_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq '.number')"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: 自动合并同步 PR
        if: steps.sync.outputs.changed == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr merge "${{ steps.sync.outputs.pr_number }}" --repo "${GITHUB_REPOSITORY}" --merge --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Dev 打包发布
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_dev.yml --repo kalicyh/Sesame-AG --ref kalicyh
