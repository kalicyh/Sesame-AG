name: Sesame-AG Dev自动打包

on:
  push:
    branches: [ kalicyh ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目主代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: 补全缺失的libxposed子模块
        run: |
          mkdir -p libxposed
          git clone https://github.com/libxposed/api.git libxposed/api
      
      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: 授予Gradle执行权限
        run: chmod +x ./gradlew

      - name: 配置正式签名
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_SIGNING_KEY}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          keystore_file="${RUNNER_TEMP}/keystore.jks"
          printf '%s' "${ANDROID_SIGNING_KEY}" | base64 --decode > "${keystore_file}"
          echo "ANDROID_KEYSTORE_FILE=${keystore_file}" >> "$GITHUB_ENV"
      
      - name: Gradle编译Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      
      - name: 保存安装包
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-Dev编译APK
          path: app/build/outputs/apk/release/*.apk

      - name: 生成Release信息
        id: release
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tag=dev-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=dev-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: 发布Dev Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          body: |
            自动构建自 `${{ github.ref_name }}`

            Commit: `${{ github.sha }}`
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
