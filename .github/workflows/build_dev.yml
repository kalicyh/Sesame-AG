name: Sesame-AG Dev自动打包

on:
  push:
    branches: [ kalicyh ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目主代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: 补全缺失的libxposed子模块
        run: |
          mkdir -p libxposed
          git clone https://github.com/libxposed/api.git libxposed/api
      
      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: 授予Gradle执行权限
        run: chmod +x ./gradlew
      
      - name: Gradle编译Release APK
        run: ./gradlew assembleRelease
      
      - name: 保存安装包
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-Dev编译APK
          path: app/build/outputs/apk/release/*.apk

      - name: 生成Release信息
        id: release
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tag=dev-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=dev-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: 发布Dev Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          body: |
            自动构建自 `${{ github.ref_name }}`

            Commit: `${{ github.sha }}`
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
